<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2711c"/>
      <stop offset="1" stop-color="#db2828"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2711c"/>
    </marker>
  </defs>

  <!-- frame -->
  <rect x="0" y="0" width="1280" height="860" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#brand)"/>

  <!-- title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#db2828">VulgarVeto — Processing Pipeline</text>
  <text x="40" y="80" font-size="15" fill="#64748b">Text or audio in → tokenized, de-obfuscated, matched, tagged, and censored out. Pure-Python NLP, no ML model.</text>

  <!-- ============ INPUT COLUMN ============ -->
  <text x="40" y="118" font-size="12" font-weight="700" letter-spacing="1.5" fill="#94a3b8">INPUT</text>

  <rect x="40" y="130" width="200" height="70" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="60" y="160" font-size="16" font-weight="700" fill="#3730a3">✍  Text</text>
  <text x="60" y="182" font-size="12" fill="#6366f1">typed or pasted · always offline</text>

  <rect x="40" y="214" width="200" height="70" rx="12" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="60" y="244" font-size="16" font-weight="700" fill="#0e7490">🎤  Audio — WAV</text>
  <text x="60" y="266" font-size="12" fill="#0891b2">uploaded file · optional mode</text>

  <!-- transcription (audio path) -->
  <rect x="40" y="306" width="200" height="104" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="328" font-size="11" font-weight="700" letter-spacing="0.5" fill="#94a3b8">audio_utils.py</text>
  <text x="56" y="350" font-size="14" font-weight="700" fill="#334155">Chunked transcription</text>
  <text x="56" y="371" font-size="11.5" fill="#64748b">SpeechRecognition →</text>
  <text x="56" y="387" font-size="11.5" fill="#64748b">Google Web Speech API</text>
  <text x="56" y="403" font-size="11.5" fill="#16a34a">native WAV read · no ffmpeg</text>

  <!-- lexicon cylinder -->
  <g>
    <ellipse cx="140" cy="452" rx="100" ry="13" fill="#fde68a" stroke="#d97706"/>
    <path d="M40,452 L40,520 A100,13 0 0 0 240,520 L240,452" fill="#fef3c7" stroke="#d97706"/>
    <ellipse cx="140" cy="452" rx="100" ry="13" fill="#fde68a" stroke="#d97706"/>
    <text x="140" y="486" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">en.txt lexicon</text>
    <text x="140" y="505" font-size="11" fill="#a16207" text-anchor="middle">~1,000 terms + phrases</text>
  </g>

  <!-- ============ NLP ENGINE ============ -->
  <rect x="300" y="108" width="560" height="612" rx="16" fill="#fff7f0" stroke="#f2c199"/>
  <text x="320" y="140" font-size="18" font-weight="700" fill="#b45309">NLP ENGINE</text>
  <text x="320" y="160" font-size="12.5" fill="#a97c50">profanity_filter.py · Python standard library only</text>

  <!-- (1) tokenize -->
  <rect x="320" y="176" width="520" height="66" rx="10" fill="#ffffff" stroke="#f0d0b0"/>
  <text x="338" y="202" font-size="15" font-weight="700" fill="#7c2d12">① Span-aware tokenization</text>
  <text x="338" y="226" font-size="12" fill="#78716c">keeps character offsets, original casing &amp; punctuation → lets us censor in place</text>

  <!-- (2) normalize -->
  <rect x="320" y="254" width="520" height="98" rx="10" fill="#ffffff" stroke="#f0d0b0"/>
  <text x="338" y="280" font-size="15" font-weight="700" fill="#7c2d12">② Normalize / de-obfuscate</text>
  <text x="338" y="302" font-size="12" fill="#78716c">Unicode fold · strip accents · lowercase</text>
  <text x="338" y="320" font-size="12" fill="#78716c">leetspeak → letters:  <tspan font-weight="700" fill="#b45309">sh1t → shit · a$$ → ass</tspan></text>
  <text x="338" y="338" font-size="12" fill="#78716c">drop separators <tspan font-weight="700" fill="#b45309">f.u.c.k → fuck</tspan> · collapse <tspan font-weight="700" fill="#b45309">fuuuck → fuck</tspan></text>

  <!-- (3) match -->
  <rect x="320" y="364" width="520" height="156" rx="10" fill="#ffffff" stroke="#f0d0b0"/>
  <text x="338" y="390" font-size="15" font-weight="700" fill="#7c2d12">③ Multi-strategy match  —  escalates with Sensitivity</text>

  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="338" y="402" width="92" height="30" rx="15" fill="#dcfce7" stroke="#86efac"/>
    <text x="384" y="422" fill="#166534">exact</text>
    <text x="437" y="422" font-size="14" fill="#94a3b8">›</text>
    <rect x="446" y="402" width="110" height="30" rx="15" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="501" y="422" fill="#1e40af">normalized</text>
    <text x="563" y="422" font-size="14" fill="#94a3b8">›</text>
    <rect x="572" y="402" width="118" height="30" rx="15" fill="#fef9c3" stroke="#fde047"/>
    <text x="631" y="422" fill="#854d0e">masked vowel</text>
    <text x="697" y="422" font-size="14" fill="#94a3b8">›</text>
    <rect x="706" y="402" width="86" height="30" rx="15" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="749" y="422" fill="#991b1b">fuzzy</text>
  </g>
  <text x="572" y="452" font-size="11" fill="#a16207">masked vowel builds a regex:  <tspan font-weight="700">f*ck → ^f[a-z]ck$</tspan></text>

  <g font-size="12" font-weight="700">
    <rect x="338" y="462" width="176" height="28" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="352" y="481" fill="#3730a3">＋ phrase / n-gram pass</text>
    <rect x="524" y="462" width="196" height="28" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="538" y="481" fill="#065f46">＋ safe-word whitelist</text>
  </g>
  <text x="338" y="508" font-size="11.5" fill="#78716c">whole-word matching + whitelist → <tspan font-weight="700" fill="#16a34a">class · analysis · cocktail · assassin are NOT flagged</tspan></text>

  <!-- (4) severity -->
  <rect x="320" y="532" width="520" height="60" rx="10" fill="#ffffff" stroke="#f0d0b0"/>
  <text x="338" y="568" font-size="15" font-weight="700" fill="#7c2d12">④ Severity tag</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="576" y="548" width="72" height="28" rx="14" fill="#f4b942"/>
    <text x="612" y="567" fill="#ffffff">mild</text>
    <rect x="656" y="548" width="102" height="28" rx="14" fill="#f2711c"/>
    <text x="707" y="567" fill="#ffffff">moderate</text>
    <rect x="766" y="548" width="72" height="28" rx="14" fill="#db2828"/>
    <text x="802" y="567" fill="#ffffff">severe</text>
  </g>

  <!-- engine internal flow arrows -->
  <g stroke="#f2711c" stroke-width="2" fill="none" marker-end="url(#arrowO)">
    <line x1="580" y1="242" x2="580" y2="253"/>
    <line x1="580" y1="352" x2="580" y2="363"/>
    <line x1="580" y1="520" x2="580" y2="531"/>
  </g>

  <!-- ============ CENSOR ============ -->
  <text x="900" y="118" font-size="12" font-weight="700" letter-spacing="1.5" fill="#94a3b8">CENSOR</text>
  <rect x="900" y="130" width="340" height="150" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="920" y="158" font-size="16" font-weight="700" fill="#b91c1c">Rebuild in place</text>
  <text x="920" y="178" font-size="12" fill="#ef4444">swap flagged spans, keep everything else</text>
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#7f1d1d">
    <rect x="920" y="192" width="90" height="28" rx="14" fill="#ffffff" stroke="#fecaca"/><text x="965" y="211">Beep</text>
    <rect x="1018" y="192" width="90" height="28" rx="14" fill="#ffffff" stroke="#fecaca"/><text x="1063" y="211">Mask</text>
    <rect x="1116" y="192" width="106" height="28" rx="14" fill="#ffffff" stroke="#fecaca"/><text x="1169" y="211">Symbols</text>
    <rect x="920" y="228" width="98" height="28" rx="14" fill="#ffffff" stroke="#fecaca"/><text x="969" y="247">Dolphin</text>
    <rect x="1026" y="228" width="94" height="28" rx="14" fill="#ffffff" stroke="#fecaca"/><text x="1073" y="247">Random</text>
    <rect x="1128" y="228" width="94" height="28" rx="14" fill="#ffffff" stroke="#fecaca"/><text x="1175" y="247">Remove</text>
  </g>

  <!-- ============ OUTPUT ============ -->
  <text x="900" y="316" font-size="12" font-weight="700" letter-spacing="1.5" fill="#94a3b8">OUTPUT</text>
  <rect x="900" y="328" width="340" height="264" rx="14" fill="#f0fdf4" stroke="#86efac"/>
  <g font-size="13.5" fill="#14532d">
    <text x="922" y="362" font-weight="700" font-size="15">What the UI shows</text>
    <text x="922" y="392">• Highlighted text (severity-colored)</text>
    <text x="922" y="420">• Censored text  +  download</text>
    <text x="922" y="448">• Metrics: tokens · flagged · rate</text>
    <text x="922" y="476">• Detection table — <tspan font-weight="700">why</tspan> each hit</text>
    <text x="922" y="504">• Clean audio: <tspan font-weight="700">gTTS → MP3</tspan> (audio path)</text>
  </g>
  <text x="922" y="546" font-size="11.5" fill="#166534">Note: audio output is re-synthesized speech,</text>
  <text x="922" y="562" font-size="11.5" fill="#166534">not the original voice bleeped.</text>

  <!-- ============ CONNECTORS ============ -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <!-- audio -> transcription -->
    <line x1="140" y1="284" x2="140" y2="306"/>
    <!-- text -> engine -->
    <path d="M240,165 C275,165 275,205 300,205"/>
    <!-- transcription -> engine -->
    <path d="M240,352 C275,352 280,214 300,214"/>
    <!-- lexicon -> match -->
    <path d="M240,470 C280,470 285,440 320,440"/>
    <!-- engine -> censor -->
    <path d="M860,205 C880,205 882,205 900,205"/>
    <!-- engine severity -> output -->
    <path d="M860,562 C878,562 884,430 900,430"/>
    <!-- censor -> output -->
    <path d="M1070,280 C1070,300 1070,308 1070,328"/>
  </g>

  <!-- ============ STREAMLIT UI band ============ -->
  <rect x="40" y="750" width="1200" height="86" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="782" font-size="16" font-weight="700" fill="#334155">🖥  Streamlit UI · app.py</text>
  <text x="64" y="806" font-size="12.5" fill="#64748b">Wraps the whole flow. Sidebar controls feed the engine &amp; censor:</text>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="470" y="768" width="150" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="545" y="785" fill="#475569">censor style → ③censor</text>
    <rect x="632" y="768" width="176" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="720" y="785" fill="#475569">sensitivity → ③match</text>
    <rect x="820" y="768" width="180" height="26" rx="13" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="910" y="785" fill="#475569">severity tiers → ④filter</text>
  </g>

  <!-- dashed link UI -> engine -->
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <line x1="580" y1="720" x2="580" y2="750"/>
  </g>
</svg>
